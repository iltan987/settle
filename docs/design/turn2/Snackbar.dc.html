<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;margin:0 12px;min-height:48px;border-radius:12px;overflow:hidden;background:var(--inv);color:var(--oninv);display:flex;align-items:center;gap:4px;padding:4px 4px 4px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);">
  <div style="flex:1;min-width:0;font:400 14px/1.4 Figtree,sans-serif;padding:10px 0;text-wrap:pretty;">{{ text }}</div>
  <sc-if value="{{ hasAction }}"><span style="min-height:48px;padding:0 14px;display:flex;align-items:center;font:700 14px/1 Figtree,sans-serif;color:var(--invpri);white-space:nowrap;">{{ action }}</span></sc-if>
  <sc-if value="{{ countdown }}"><span style="position:absolute;left:0;bottom:0;height:3px;width:{{ left }};background:var(--invpri);"></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:72},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Moved to the trash&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Undo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;countdown&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:70,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { text: p.text ?? '', action: p.action ?? '', hasAction: !!p.action, countdown: p.countdown != null, left: `${p.countdown ?? 0}%` };
  }
}
</script>
</body>
</html>
