<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;">
  <sc-if value="{{ hasInfo }}">
    <div style="margin:0 10px 8px;padding:10px 14px;border-radius:16px;background:var(--surf);box-shadow:0 2px 12px rgba(0,0,0,.14);display:flex;gap:10px;align-items:flex-start;">
      <span style="font:400 20px/1.1 'Material Symbols Rounded';color:var(--ink2);">{{ infoIcon }}</span>
      <span style="flex:1;font:400 13.5px/1.45 Figtree,sans-serif;color:var(--ink);text-wrap:pretty;">{{ infoText }}</span>
    </div>
  </sc-if>
  <div style="min-height:104px;box-sizing:border-box;padding:10px 8px 28px;background:var(--c1);display:grid;grid-template-columns:{{ gtc }};">
    <sc-for list="{{ acts }}" as="a" hint-placeholder-count="4">
      <div style="min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ a.fg }};opacity:{{ a.op }};text-align:center;padding:0 2px;">
        <span style="position:relative;width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font:400 24px/1 'Material Symbols Rounded';">{{ a.icon }}<sc-if value="{{ a.hasBadge }}"><span style="position:absolute;top:-2px;right:6px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--pri);color:var(--onpri);font:700 11px/18px Figtree,sans-serif;">{{ a.badge }}</span></sc-if></span>
        <span style="font:600 12.5px/1.25 Figtree,sans-serif;">{{ a.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:180},&quot;actions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{icon:string,label:string,tone?:'err',disabled?:boolean,badge?:string}[]&quot;},&quot;info&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{icon:string,text:string}|null&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const list = this.props.actions || [];
    const acts = list.map(a => ({ ...a, fg: a.tone === 'err' ? 'var(--err)' : 'var(--ink)', op: a.disabled ? 0.38 : 1, hasBadge: !!a.badge, badge: a.badge || '' }));
    const i = this.props.info;
    return { acts, gtc: `repeat(${acts.length || 4},minmax(0,1fr))`, hasInfo: !!i, infoIcon: i?.icon || '', infoText: i?.text || '' };
  }
}
</script>
</body>
</html>
