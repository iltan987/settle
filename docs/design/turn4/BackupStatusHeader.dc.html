<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="margin:{{ margin }};padding:20px 12px 8px 20px;border-radius:28px;background:{{ bg }};color:{{ fg }};display:flex;flex-direction:column;gap:12px;">
  <div style="display:flex;gap:14px;align-items:flex-start;padding-right:8px;">
    <span style="width:44px;height:44px;border-radius:14px;background:{{ tileBg }};color:{{ tileFg }};display:flex;align-items:center;justify-content:center;font:400 26px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;flex:none;">{{ icon }}</span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px;">
      <div style="font:600 20px/1.3 Figtree,sans-serif;text-wrap:pretty;">{{ title }}</div>
      <sc-if value="{{ hasBody }}"><div style="font:400 14px/1.45 Figtree,sans-serif;text-wrap:pretty;">{{ body }}</div></sc-if>
    </div>
  </div>
  <sc-if value="{{ hasProgress }}">
    <div style="display:flex;flex-direction:column;gap:6px;padding-right:8px;">
      <div style="height:8px;border-radius:4px;background:{{ trackBg }};overflow:hidden;"><div style="height:100%;width:{{ pw }};background:{{ tileBg }};border-radius:4px;"></div></div>
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font:500 13px/1.35 Figtree,sans-serif;"><span>{{ progressLabel }}</span><span>{{ progressMeta }}</span></div>
    </div>
  </sc-if>
  <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px 8px;">
    <sc-if value="{{ hasSecondary }}"><span style="min-height:48px;padding:0 12px;display:flex;align-items:center;font:600 14px/1.2 Figtree,sans-serif;">{{ secondary }}</span></sc-if>
    <sc-if value="{{ hasAction }}"><span style="min-height:48px;display:flex;align-items:center;"><span style="min-height:40px;padding:0 18px;border-radius:20px;background:{{ tileBg }};color:{{ tileFg }};display:flex;align-items:center;gap:6px;font:600 14px/1.2 Figtree,sans-serif;"><sc-if value="{{ hasActionIcon }}"><span style="font:400 18px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1;">{{ actionIcon }}</span></sc-if>{{ action }}</span></span></sc-if>
    <sc-if value="{{ noActions }}"><span style="height:4px;"></span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:220},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;busy&quot;,&quot;warn&quot;,&quot;err&quot;,&quot;off&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;'ok'|'busy'|'warn'|'err'|'off'&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;cloud_done&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;All in Drive&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number|null&quot;},&quot;progressLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progressMeta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flush&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, tone = p.tone ?? 'ok';
    const T = {
      ok: ['var(--c1)', 'var(--ink)', 'var(--pri)', 'var(--onpri)', 'var(--c3)'],
      busy: ['var(--c1)', 'var(--ink)', 'var(--pri)', 'var(--onpri)', 'var(--c3)'],
      warn: ['var(--wc)', 'var(--onwc)', 'var(--onwc)', 'var(--wc)', 'rgba(127,90,0,.25)'],
      err: ['var(--ec)', 'var(--onec)', 'var(--onec)', 'var(--ec)', 'rgba(120,20,20,.2)'],
      off: ['var(--c1)', 'var(--ink)', 'var(--ink2)', 'var(--c1)', 'var(--c3)'],
    }[tone];
    return {
      margin: p.flush ? '0' : '4px 12px 8px',
      bg: T[0], fg: T[1], tileBg: T[2], tileFg: T[3], trackBg: T[4],
      icon: p.icon ?? 'cloud_done', title: p.title ?? '', body: p.body ?? '', hasBody: !!p.body,
      hasProgress: p.progress != null, pw: `${p.progress ?? 0}%`, progressLabel: p.progressLabel ?? '', progressMeta: p.progressMeta ?? '',
      hasAction: !!p.action, action: p.action ?? '', hasActionIcon: !!p.actionIcon, actionIcon: p.actionIcon ?? '',
      hasSecondary: !!p.secondary, secondary: p.secondary ?? '', noActions: !p.action && !p.secondary,
    };
  }
}
</script>
</body>
</html>
