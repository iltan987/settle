<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:104px;box-sizing:border-box;padding:12px 8px 28px;background:var(--c1);display:flex;justify-content:space-around;">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
    <div style="min-width:88px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span style="position:relative;width:64px;height:32px;border-radius:16px;background:{{ t.bg }};color:{{ t.fg }};display:flex;align-items:center;justify-content:center;font:400 24px/1 'Material Symbols Rounded';font-variation-settings:'FILL' {{ t.fill }};">{{ t.icon }}<sc-if value="{{ t.dot }}"><span style="position:absolute;top:3px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--err);box-shadow:0 0 0 2px var(--c1);"></span></sc-if></span>
      <span style="font:{{ t.w }} 12.5px/1.3 Figtree,sans-serif;color:{{ t.lc }};">{{ t.label }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:104},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;photos&quot;,&quot;folders&quot;,&quot;backup&quot;],&quot;default&quot;:&quot;photos&quot;,&quot;tsType&quot;:&quot;'photos'|'folders'|'backup'&quot;},&quot;backupDot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'photos';
    const tabs = [['photos', 'photo_library', 'Photos'], ['folders', 'folder', 'Folders'], ['backup', 'cloud_sync', 'Backup']].map(([k, icon, label]) => {
      const on = k === a;
      return { icon, label, fill: on ? 1 : 0, bg: on ? 'var(--pc)' : 'transparent', fg: on ? 'var(--onpc)' : 'var(--ink2)', lc: on ? 'var(--ink)' : 'var(--ink2)', w: on ? 700 : 500, dot: k === 'backup' && !!this.props.backupDot };
    });
    return { tabs };
  }
}
</script>
</body>
</html>
